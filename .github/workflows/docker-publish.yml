
name: FixFlow Docker CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve Docker Hub username
        env:
          RAW_DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
        run: |
          USERNAME="$(echo "$RAW_DOCKERHUB_USERNAME" | sed -E 's/^[[:space:]]*docker[[:space:]]+login[[:space:]]+-u[[:space:]]+//' | awk '{print $1}' | tr -d '\r')"
          if [ -z "$USERNAME" ]; then
            echo "DOCKERHUB username is empty. Set vars.DOCKERHUB_USERNAME (or secrets.DOCKERHUB_USERNAME) to your Docker Hub account name."
            exit 1
          fi
          echo "DOCKERHUB_USERNAME=$USERNAME" >> "$GITHUB_ENV"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.DOCKERHUB_USERNAME }}/fixflow-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ env.DOCKERHUB_USERNAME }}/fixflow-frontend:latest
