
services:
  db:
    image: postgres:16-alpine
    container_name: appliance-repair-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: practicedb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
    volumes:
      - appliance_repair_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d practicedb"]
      interval: 5s
      timeout: 5s
      retries: 15

  backend:
    image: imdp07/fixflow-backend:latest
    container_name: appliance-repair-backend
    restart: unless-stopped
    environment:
      SERVER_PORT: 8001
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/practicedb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: imdp07/fixflow-frontend:latest
    container_name: appliance-repair-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  appliance_repair_data:
